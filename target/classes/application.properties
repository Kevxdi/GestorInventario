# Configuracion del servidor
server.port=8080

# Conexion a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/talleres_lgr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# No modificar automaticamente las tablas existentes.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Carga idempotente de las categorías del catálogo.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/*.sql