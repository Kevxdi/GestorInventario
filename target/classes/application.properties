# Configuracion del servidor
server.port=8080

# Conexion a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/talleres_lgr_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Pruebasback12.

# JPA / Hibernate
# En desarrollo usas 'update' para que Hibernate sincronice las entidades con las tablas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Carga idempotente de las categorías del catálogo.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/categorias.sql